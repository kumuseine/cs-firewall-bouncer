name: Check Upstream and Build Bouncer

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # 每天凌晨 3:00 自动嗅探上游版本

permissions:
  contents: write    # 允许在自己仓库打 Git Tag
  packages: write    # 允许推送到 GHCR

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.check.outputs.needs_build }}
      target_version: ${{ steps.check.outputs.target_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取所有 Git Tag 用于比对

      - name: Check upstream release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 注入凭据，解除 GitHub API 频率限制
        run: |
          # 1. 使用官方 gh CLI 提取上游最新 Release 标签
          UPSTREAM_TAG=$(gh release view --repo crowdsecurity/cs-firewall-bouncer --json tagName --jq .tagName)
          echo "Upstream latest release is: $UPSTREAM_TAG"

          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
            echo "Failed to fetch upstream release!" >&2
            exit 1
          fi

          # 2. 检查本地是否已打过该版本标签（手动触发 workflow_dispatch 时强制构建）
          if git rev-parse "$UPSTREAM_TAG" >/dev/null 2>&1 && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Version $UPSTREAM_TAG has already been built. Skipping."
            echo "needs_build=false" >> $GITHUB_OUTPUT
          else
            echo "Proceeding to build version: $UPSTREAM_TAG"
            echo "needs_build=true" >> $GITHUB_OUTPUT
            echo "target_version=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: check-version
    if: needs.check-version.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BOUNCER_VERSION=${{ needs.check-version.outputs.target_version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.check-version.outputs.target_version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag and archive release in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.check-version.outputs.target_version }} || true
          git push origin ${{ needs.check-version.outputs.target_version }} || true
