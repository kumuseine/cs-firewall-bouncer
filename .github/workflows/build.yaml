name: Check Upstream and Build Bouncer

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write
  packages: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.check.outputs.needs_build }}
      upstream_version: ${{ steps.check.outputs.upstream_version }}
      short_sha: ${{ steps.check.outputs.short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream and generate metadata
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_TAG=$(gh release view --repo crowdsecurity/cs-firewall-bouncer --json tagName --jq .tagName)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "Upstream latest release: $UPSTREAM_TAG"
          echo "Current commit SHA: $SHORT_SHA"

          echo "upstream_version=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

          # 定时任务检测是否需要构建；如果是 push / 手动触发，则强制构建
          if [ "${{ github.event_name }}" = "schedule" ] && git rev-parse "$UPSTREAM_TAG" >/dev/null 2>&1; then
            echo "Scheduled check: Upstream $UPSTREAM_TAG already processed. Skipping."
            echo "needs_build=false" >> $GITHUB_OUTPUT
          else
            echo "Building image for upstream $UPSTREAM_TAG (commit: $SHORT_SHA)"
            echo "needs_build=true" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: check-version
    if: needs.check-version.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BOUNCER_VERSION=${{ needs.check-version.outputs.upstream_version }}
          # 核心改动：同时打上 latest、上游版本、以及绑定你当前提交 sha 的精准标签
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ needs.check-version.outputs.upstream_version }}
            ghcr.io/${{ github.repository }}:${{ needs.check-version.outputs.upstream_version }}-${{ needs.check-version.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 自动化垃圾回收：自动清理旧版本和 untagged 垃圾
  cleanup-packages:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Delete old and untagged images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'cs-firewall-bouncer'
          package-type: 'container'
          min-versions-to-keep: 10 # 始终保留最新的 10 个版本
          delete-only-untagged-versions: 'false' # 开启后自动删除超过 10 个的旧版本以及所有 untagged 悬空包
