name: Check Upstream and Build Bouncer

on:
  push:
    branches: [ "main" ] # 任何 push 变动（修改 Dockerfile 或 entrypoint）必重新构建
  workflow_dispatch:      # 网页上手动点运行，必重新构建
  schedule:
    - cron: '0 3 * * *'  # 仅在定时巡检时，才按版本号做增量跳过

permissions:
  contents: write
  packages: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.check.outputs.needs_build }}
      target_version: ${{ steps.check.outputs.target_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_TAG=$(gh release view --repo crowdsecurity/cs-firewall-bouncer --json tagName --jq .tagName)
          echo "Upstream latest release is: $UPSTREAM_TAG"

          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
            echo "Failed to fetch upstream release!" >&2
            exit 1
          fi

          # 👇 核心调整：只有在定时任务 (schedule) 触发，且该版本已经打过 Tag 时，才跳过；
          # 如果是 push 或者 workflow_dispatch，无条件强制重新构建！
          if [ "${{ github.event_name }}" = "schedule" ] && git rev-parse "$UPSTREAM_TAG" >/dev/null 2>&1; then
            echo "Scheduled check: Version $UPSTREAM_TAG already built. Skipping."
            echo "needs_build=false" >> $GITHUB_OUTPUT
          else
            echo "Triggered by [${{ github.event_name }}]: Force rebuild version $UPSTREAM_TAG"
            echo "needs_build=true" >> $GITHUB_OUTPUT
            echo "target_version=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: check-version
    if: needs.check-version.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BOUNCER_VERSION=${{ needs.check-version.outputs.target_version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.check-version.outputs.target_version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag and archive release in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 使用 -f 强制刷新 Tag，使其永远指向最新的这次 commit 修复代码
          git tag -f ${{ needs.check-version.outputs.target_version }}
          git push origin -f ${{ needs.check-version.outputs.target_version }}
